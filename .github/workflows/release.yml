name: Release gem

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_8_1.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8_1.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/rails_8_1.gemfile
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test standard

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: script/verify-version-tag
      - run: bundle exec rake
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
